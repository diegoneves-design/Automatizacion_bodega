# Tema base de la interfaz. El verde del menú lateral NO se define aquí
# (config.toml no admite variables CSS): vive en src/ui_theme.py (--menu-green).

[theme]
base = "light"
primaryColor = "#1a6ed8"
backgroundColor = "#f3f6fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f2540"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
